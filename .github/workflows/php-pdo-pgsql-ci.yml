name: PHP PDO_PGSQL CI

permissions: {}

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "Exact commit to test; defaults to the triggering ref"
        required: false
        type: string
        default: ""
      run-integration:
        description: "Allow jobs that use AWS credentials"
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "php/pdo_pgsql/**"

defaults:
  run:
    working-directory: php/pdo_pgsql

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: pdo_pgsql
          tools: composer

      - name: Install connector dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run connector unit tests
        run: vendor/bin/phpunit --testsuite unit

  create-cluster:
    if: github.event_name != 'pull_request' || inputs.run-integration
    needs: build
    uses: ./.github/workflows/dsql-cluster-create.yml
    with:
      workflow_name: php-pdo-pgsql
    secrets:
      IAM_ROLE: ${{ secrets.IAM_ROLE }}
    permissions:
      id-token: write

  integration-tests:
    needs: create-cluster
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: pdo_pgsql
          tools: composer

      - name: Install connector dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Download Amazon root certificate
        run: |
          mkdir -p ~/.postgresql
          wget -q https://www.amazontrust.com/repository/AmazonRootCA1.pem -O ~/.postgresql/root.crt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ needs.create-cluster.outputs.region }}

      - name: Run connector integration tests
        env:
          CLUSTER_USER: "admin"
          CLUSTER_ENDPOINT: ${{ needs.create-cluster.outputs.cluster-endpoint }}
          REGION: ${{ needs.create-cluster.outputs.region }}
        run: vendor/bin/phpunit --testsuite integration

      - name: Install example dependencies
        working-directory: php/pdo_pgsql/example
        run: composer install --no-interaction --prefer-dist

      - name: Run example integration tests
        working-directory: php/pdo_pgsql/example
        env:
          CLUSTER_USER: "admin"
          CLUSTER_ENDPOINT: ${{ needs.create-cluster.outputs.cluster-endpoint }}
          REGION: ${{ needs.create-cluster.outputs.region }}
        run: php src/example_preferred.php

  delete-cluster:
    if: always() && needs.create-cluster.result == 'success'
    needs: [create-cluster, integration-tests]
    uses: ./.github/workflows/dsql-cluster-delete.yml
    with:
      cluster-id: ${{ needs.create-cluster.outputs.cluster-id }}
      region: ${{ needs.create-cluster.outputs.region }}
    secrets:
      IAM_ROLE: ${{ secrets.IAM_ROLE }}
    permissions:
      id-token: write

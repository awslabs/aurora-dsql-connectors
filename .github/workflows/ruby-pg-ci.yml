name: Ruby pg CI

permissions: {}

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "Exact commit to test; defaults to the triggering ref"
        required: false
        type: string
        default: ""
      run-integration:
        description: "Allow jobs that use AWS credentials"
        required: false
        type: boolean
        default: true
  push:
    branches: [main]

defaults:
  run:
    working-directory: ruby/pg

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      target-versions: ${{ steps.versions.outputs.matrix }}
    steps:
      - id: versions
        working-directory: .
        run: echo 'matrix=["3.1", "3.2", "3.3"]' >> "$GITHUB_OUTPUT"

  create-cluster:
    if: github.event_name != 'pull_request' || inputs.run-integration
    needs: build
    uses: ./.github/workflows/dsql-cluster-create.yml
    with:
      workflow_name: ruby-pg
    secrets:
      IAM_ROLE: ${{ secrets.IAM_ROLE }}
    permissions:
      id-token: write # required by aws-actions/configure-aws-credentials

  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        ruby-version: ${{ fromJson(needs.setup.outputs.target-versions) }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
          working-directory: ruby/pg

      - name: Run connector unit tests
        run: bundle exec rake unit

  integration-tests:
    needs: [setup, create-cluster]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required by aws-actions/configure-aws-credentials
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        ruby-version: ${{ fromJson(needs.setup.outputs.target-versions) }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
          working-directory: ruby/pg

      - name: Download Amazon root certificate
        run: |
          mkdir -p ~/.postgresql
          wget -q https://www.amazontrust.com/repository/AmazonRootCA1.pem -O ~/.postgresql/root.crt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ needs.create-cluster.outputs.region }}

      - name: Run connector integration tests
        env:
          CLUSTER_USER: "admin"
          CLUSTER_ENDPOINT: ${{ needs.create-cluster.outputs.cluster-endpoint }}
          REGION: ${{ needs.create-cluster.outputs.region }}
        run: bundle exec rake integration

      - name: Install example dependencies
        working-directory: ruby/pg/example
        run: bundle install

      - name: Run example integration tests
        working-directory: ruby/pg/example
        env:
          CLUSTER_USER: "admin"
          CLUSTER_ENDPOINT: ${{ needs.create-cluster.outputs.cluster-endpoint }}
          REGION: ${{ needs.create-cluster.outputs.region }}
        run: bundle exec rspec test/ --format documentation

  delete-cluster:
    if: always() && needs.create-cluster.result == 'success'
    needs: [create-cluster, integration-tests]
    uses: ./.github/workflows/dsql-cluster-delete.yml
    with:
      cluster-id: ${{ needs.create-cluster.outputs.cluster-id }}
      region: ${{ needs.create-cluster.outputs.region }}
    secrets:
      IAM_ROLE: ${{ secrets.IAM_ROLE }}
    permissions:
      id-token: write # required by aws-actions/configure-aws-credentials

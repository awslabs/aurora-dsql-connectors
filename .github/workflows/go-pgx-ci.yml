name: Go pgx CI

permissions: {}

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout-ref:
        description: "Exact commit to test; defaults to the triggering ref"
        required: false
        type: string
        default: ""
      run-integration:
        description: "Allow jobs that use AWS credentials"
        required: false
        type: boolean
        default: true
  push:
    branches: [main]

defaults:
  run:
    working-directory: go/pgx

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/awslabs/aurora-dsql-connectors

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "::error::go.mod/go.sum not tidy; run 'go mod tidy'" && exit 1)

      - name: Check go mod tidy (example)
        working-directory: go/pgx/example
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "::error::example go.mod/go.sum not tidy; run 'go mod tidy'" && exit 1)

      - name: Run connector unit tests
        run: go test -v ./dsql/...

  create-cluster:
    if: github.event_name != 'pull_request' || inputs.run-integration
    needs: build
    uses: ./.github/workflows/dsql-cluster-create.yml
    with:
      workflow_name: go-pgx
    secrets:
      IAM_ROLE: ${{ secrets.IAM_ROLE }}
    permissions:
      id-token: write # required by aws-actions/configure-aws-credentials

  integration-tests:
    needs: create-cluster
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required by aws-actions/configure-aws-credentials
    env:
      GOPRIVATE: github.com/awslabs/aurora-dsql-connectors

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.24"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ needs.create-cluster.outputs.region }}

      - name: Run integration tests
        working-directory: go/pgx/example
        env:
          CLUSTER_USER: "admin"
          CLUSTER_ENDPOINT: ${{ needs.create-cluster.outputs.cluster-endpoint }}
          REGION: ${{ needs.create-cluster.outputs.region }}
        run: go test -v ./test/...

  delete-cluster:
    if: always() && needs.create-cluster.result == 'success'
    needs: [create-cluster, integration-tests]
    uses: ./.github/workflows/dsql-cluster-delete.yml
    with:
      cluster-id: ${{ needs.create-cluster.outputs.cluster-id }}
      region: ${{ needs.create-cluster.outputs.region }}
    secrets:
      IAM_ROLE: ${{ secrets.IAM_ROLE }}
    permissions:
      id-token: write # required by aws-actions/configure-aws-credentials
